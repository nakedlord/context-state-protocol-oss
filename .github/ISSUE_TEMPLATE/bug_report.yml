name: Bug report
description: Report a problem with CSP docs, scripts, examples, or validation.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands and paths when possible.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: checks
    attributes:
      label: Checks run
      description: Paste relevant output from CSP scripts.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: This issue does not include private project state, secrets, raw chat exports, or personal data.
          required: true
